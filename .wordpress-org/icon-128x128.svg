<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Woo Subscription Snapshot logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- aperture ring hinting "snapshot" -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- baseline -->
  <line x1="30" y1="90" x2="98" y2="90" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- upward trend line -->
  <polyline points="32,84 50,70 66,76 84,48 96,40" fill="none" stroke="url(#line)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="84" cy="48" r="5.5" fill="#f59e0b"/>
  <circle cx="96" cy="40" r="6" fill="#f59e0b"/>
  <!-- shutter tick marks -->
  <g fill="#475569">
    <circle cx="64" cy="20" r="2.5"/>
    <circle cx="64" cy="108" r="2.5"/>
    <circle cx="20" cy="64" r="2.5"/>
    <circle cx="108" cy="64" r="2.5"/>
  </g>
</svg>
