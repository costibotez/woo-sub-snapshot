<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="Woo Subscription Snapshot — Know who's subscribed. Track growth and churn. Trust the history.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="6" fill="url(#accent)"/>

  <!-- Chart motif, right side -->
  <g transform="translate(870 90)" font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="0" y="0" width="600" height="320" rx="18" fill="#0b1220" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5"/>
    <!-- gridlines -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="40" y1="60" x2="560" y2="60"/>
      <line x1="40" y1="130" x2="560" y2="130"/>
      <line x1="40" y1="200" x2="560" y2="200"/>
      <line x1="40" y1="270" x2="560" y2="270"/>
    </g>
    <!-- active subscriptions area + line (amber, trending up) -->
    <path d="M40 250 L126 232 L212 236 L298 190 L384 176 L470 128 L560 96 L560 270 L40 270 Z" fill="url(#area)"/>
    <polyline points="40,250 126,232 212,236 298,190 384,176 470,128 560,96" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- pending-cancel line (red, flatter) -->
    <polyline points="40,262 126,258 212,260 298,252 384,255 470,248 560,244" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <g fill="#f59e0b">
      <circle cx="298" cy="190" r="5"/>
      <circle cx="470" cy="128" r="5"/>
      <circle cx="560" cy="96" r="5.5"/>
    </g>
    <!-- legend -->
    <g font-size="15" fill="#94a3b8">
      <rect x="40" y="292" width="12" height="12" rx="3" fill="#f59e0b"/>
      <text x="60" y="302">Active</text>
      <rect x="150" y="292" width="12" height="12" rx="3" fill="#f87171"/>
      <text x="170" y="302">Pending cancel</text>
    </g>
  </g>

  <!-- Wordmark, left side -->
  <g transform="translate(96 176)" font-family="'Segoe UI',system-ui,sans-serif">
    <text x="0" y="0" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1">Woo Subscription</text>
    <text x="0" y="80" font-size="72" font-weight="800" fill="url(#accent)" letter-spacing="-1">Snapshot</text>
    <text x="2" y="150" font-size="27" font-weight="500" fill="#cbd5e1">Know who&#8217;s subscribed. Track growth and churn.</text>
    <text x="2" y="188" font-size="27" font-weight="500" fill="#cbd5e1">Trust the history.</text>
    <!-- little pills -->
    <g transform="translate(2 224)" font-size="15" font-weight="600">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#1e293b"/>
      <text x="66" y="22" text-anchor="middle" fill="#94a3b8">WooCommerce</text>
      <rect x="146" y="0" width="118" height="34" rx="17" fill="#1e293b"/>
      <text x="205" y="22" text-anchor="middle" fill="#94a3b8">Churn &amp; MRR</text>
      <rect x="276" y="0" width="150" height="34" rx="17" fill="#1e293b"/>
      <text x="351" y="22" text-anchor="middle" fill="#94a3b8">REST &amp; WP-CLI</text>
    </g>
  </g>
</svg>
